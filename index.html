<!DOCTYPE html>
<html lang="en">
<head>

          </svg>
        </a>
        <a href="mailto:amir@nasari.me" aria-label="Email">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </a>
        <a href="https://njump.me/npub1q5vqemfc4qkscj97wael7clkqstjkj335ykjvydlcep0g888v42qqmy4un" target="_blank" rel="noopener" aria-label="Nostr">

          </svg>
        </a>
        <a href="https://www.chess.com/member/badoriio" target="_blank" rel="noopener" aria-label="Chess.com">

            <polyline points="4,20 6,12 10,16 12,6 14,16 18,12 20,20"/>
          </svg>
        </a>
      </div>
    </section>

  </main>

  <footer>
    <p>© <span id="year"></span> Badoriie</p>
  </footer>

  <script>
    const tagline = document.querySelector('.tagline');
    const text = tagline.dataset.text;
    let i = 0;
    const type = () => {
      tagline.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(type, 75);
    };
    setTimeout(type, 500);

    document.getElementById('year').textContent = new Date().getFullYear();

    document.querySelector('.avatar').addEventListener('click', function () {
      this.classList.toggle('lit');
    });
  </script>
</body>
</html>
